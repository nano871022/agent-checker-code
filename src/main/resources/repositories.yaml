global_settings:
  check_interval_minutes: 30
  auto_triage_enabled: true
  repositories_base_path: "~/git"

repositories:
  - name: "Finances"
    enabled: true
    package_name: "co.japl.android.myapplication"
    github:
      owner: "nano871022"
      repo: "finances"
      default_branch: "main"
      issue_labels:
        - "agent-autofix"
        - "crashlytics"
    github_actions:
      enabled: true
      workflows_to_monitor:
        - "lint.yml"
        - "test.yml"
        - "TestRun.yml"
    crashlytics:
      enabled: true
      app_id: "1:332922408573:android:33801dcc0736245840ab14"
      min_error_threshold: 1
    audit:
      enabled: true
      repository_files:
        - ".github/workflows/lint.yml"
        - ".github/workflows/test.yml"
        - ".github/workflows/TestRun.yml"
    stitch:
      enabled: true
      theme_config_path: "src/main/java/co/com/japl/ui/theme/Theme.kt"
      ui_components_dir: ""
